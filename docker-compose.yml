services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aio-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "TroqueEstaSenha!2026"
      MSSQL_PID: "Developer"
    ports:
      - "14330:1433"
    volumes:
      - aio_sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"TroqueEstaSenha!2026\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  aio_sqlserver_data:
